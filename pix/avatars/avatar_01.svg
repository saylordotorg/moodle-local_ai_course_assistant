<?xml version="1.0" encoding="UTF-8"?>
<!--
  Default assistant avatar — deliberately brand-neutral.

  This is the shipped default, so it must not carry any institution's mark. The
  plugin white-labels itself through four settings, and a default avatar reading
  "SOLA" would contradict that for every site that is not Saylor. Saylor's own
  SOLA mark is uploaded per-site through Settings > Custom avatars, which stores
  it in Moodle's file area rather than here, so a plugin upgrade cannot
  overwrite it.

  Vector, not raster, so the letters stay sharp at every size the widget draws
  this at (24px in the header through to the avatar picker and Retina).
  textLength + lengthAdjust pin the wordmark to an exact width, so it keeps its
  proportions even where the first font in the stack is unavailable.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="AI assistant">
  <circle cx="100" cy="100" r="92" fill="#171F2C"/>
  <text x="100" y="122"
        text-anchor="middle"
        textLength="72" lengthAdjust="spacingAndGlyphs"
        font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif"
        font-size="62" font-weight="500" letter-spacing="6"
        fill="#ffffff">AI</text>
</svg>

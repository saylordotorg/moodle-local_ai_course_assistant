name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # A review run costs real money (~$2-3) and fans out across several
    # subagents, so don't spend it on pull requests that contain no reviewable
    # code. This repo opens plenty of prose-only PRs -- release notes, deploy
    # requests, changelog updates -- and those now skip the review entirely.
    #
    # IMPORTANT, because this is easy to get wrong: for pull_request events
    # GitHub evaluates these filters against the ENTIRE PR diff (base...head),
    # not against the individual push that triggered the run. So this does NOT
    # stop a doc-only push from re-reviewing a PR that also contains code --
    # verified on PR #193, where a push touching only .drafts/*.md still
    # triggered a full run. The only way to avoid that cost is to batch commits
    # before pushing.
    #
    # What it does buy: a wholly-documentation PR is skipped outright.
    paths-ignore:
      - '.drafts/**'
      - '.wiki/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  claude-review:
    # Skip Dependabot PRs: GitHub runs Dependabot-triggered pull_request
    # workflows with a restricted token that reads from Dependabot secrets, not
    # Actions secrets, so ANTHROPIC_API_KEY is empty and the review fails with
    # is_error. Guard here so these runs are skipped cleanly, not marked failed.
    if: github.actor != 'dependabot[bot]'

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is REQUIRED for the review to post anything.
          #
          # Step 7 of the code-review command reads: "If --comment argument was
          # NOT provided, stop here. Do not post any GitHub comments." Without it
          # the command does the entire review -- launches its haiku/sonnet/opus
          # subagents, finds issues, validates them -- prints the summary to a
          # terminal nobody reads, and exits. The job goes green and the tokens are
          # billed either way.
          #
          # That silence was misdiagnosed three times as a permissions problem: PR
          # #192 granted Task/Read/Grep/Glob, then v7.0.3 fixed the allowedTools
          # whitespace splitting that had made those grants useless. Both were real
          # bugs, neither was the reason nothing posted. The tell was there all
          # along -- "No buffered inline comments" is what a review that was told
          # not to comment prints -- and reading the command's own definition would
          # have found it in one step.
          # The trailing instruction is a mitigation for the abandoned-agent
          # failure the gate below detects. Step 4 of /code-review launches its
          # reviewers as BACKGROUND agents, and the SDK will end the session
          # while they are still running -- on PR #239 it stopped with 3 of 6
          # unreported and reported success. Telling the session not to finish
          # early cannot make that impossible, but it removes the "I've launched
          # them, my work here is done" reading that produced every silent run.
          # The gate stays regardless: this reduces the failure rate, it does
          # not make the failure detectable, which is a different job.
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Do not end your turn while any review agent is still running. Wait for
            every agent to report, synthesise their findings, and post the review
            comment before you finish. If you are about to say that agents are
            "still running" or that you will "report once they come back", you are
            stopping too early: wait for them instead.

          # Without this the review runs, reports success, bills for the tokens
          # and posts nothing -- v7.0.1's run finished with
          # permission_denials_count: 21 and "No buffered inline comments",
          # which is indistinguishable from "found no issues".
          #
          # The /code-review command declares only its gh calls and the inline
          # comment tool in its own frontmatter, but it fans the review out
          # across Haiku/Sonnet/Opus subagents. Launching those needs Task, and
          # the subagents need Read/Grep/Glob to look at the code, none of which
          # the frontmatter covers -- so those were the denied calls.
          #
          # Bash is scoped to the gh binary rather than granted wholesale:
          # pull_request runs check out an untrusted head, so a blanket Bash
          # grant would let a contributor's branch run arbitrary commands with a
          # token that has pull-requests: write.
          #
          # It must be Bash(gh:*) and NOT per-subcommand patterns like
          # Bash(gh pr view:*). The action splits this value on whitespace as
          # well as on commas, so a pattern containing spaces is shredded into
          # separate entries -- PR #193 passed Bash(gh pr view:*) and the parsed
          # allowedTools came back as "Bash(gh", "pr", "view:*)". None of those
          # match anything, so every gh call was still denied: 28 denials, $2.34
          # billed, nothing posted. Keep every pattern space-free.
          #
          # The read-only shell utilities are here because Claude Code matches a
          # compound command segment by segment: `gh pr diff 207 | head -200`
          # needs BOTH `gh` and `head` granted or the whole call is denied. The
          # review's subagents pipe gh output constantly, which is the most
          # likely source of the 26 denials on the v7.2.1 run (11 turns, $1.61,
          # nothing posted, `--comment` correctly present). None of these
          # binaries can execute code from the checked-out branch, so the
          # untrusted-head property the gh scoping protects is unaffected --
          # unlike a blanket Bash grant, or a grant of php/npm/make.
          #
          # Edit and Write are deliberately absent. A reviewer reports; it does
          # not rewrite the branch it is reviewing.
          claude_args: >-
            --allowedTools
            Task,Read,Grep,Glob,TodoWrite,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(awk:*),Bash(sed:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(find:*),Bash(ls:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment

          # This has now been diagnosed five times from a log that does not say
          # what was denied -- the action hides the SDK output by default, so
          # every round has been a guess, and three of the guesses were wrong.
          # Turning it on ends that: the next run names the denied calls
          # directly. The repository is public and the review output is posted
          # publicly anyway, so there is nothing here the log did not already
          # contain; the API key is masked by the action, not by this flag.
          show_full_output: true
          # WHAT THE FULL LOG ACTUALLY SHOWED, once show_full_output was on.
          # Six rounds of guessing ended here, and neither cause was guessable
          # from the old log. Run 33258383102 on PR #208:
          #
          #   1. Every single denial was `gh pr diff <N> ... > somefile`. The
          #      review's subagents redirect the diff to a file because it is
          #      large. Shell output redirection is a WRITE, and it is refused
          #      even for a path inside the checkout:
          #        "Output redirection to '.../diffout.txt' was blocked. For
          #         security, Claude Code may only write to files in the allowed
          #         working directories for this session: '.../<the checkout>'"
          #      The tool grant cannot lift this -- the block is on redirection
          #      itself, not on the `gh` binary, and granting Write to a
          #      pull_request run that checks out an untrusted head is not a
          #      trade worth making. Adding awk/sed here at least lets a subagent
          #      fall back to piping instead of redirecting; one denial in that
          #      run was a pipe into awk.
          #
          #   2. The run then ENDED without waiting. Final result text was
          #      literally "All four review agents are running in parallel.
          #      Waiting for results.", num_turns 9, $1.69 billed. Step 4 of the
          #      command launches its four reviewers, the SDK launched them
          #      ASYNCHRONOUSLY, and the session terminated before any of them
          #      reported back. Nothing was ever synthesised, so there was
          #      nothing to post -- which is why the log says "No buffered
          #      inline comments" while looking, once again, exactly like a
          #      clean review.
          #
          # Neither of these lives in this file. Until they are fixed upstream,
          # `@claude please review this diff` in a PR comment is the working
          # path -- that workflow posts, and it produced ten findings on #207.
          #
          # One more way this posts nothing, and it is in the command, not here:
          # step 1 of /code-review launches a haiku agent that stops the whole
          # review if the PR is closed, is a draft, looks automated, or if
          # "claude has already commented on this PR". So asking @claude for a
          # review in a comment and then pushing again means the second review
          # exits at step 1 by design. Not a bug, but indistinguishable from
          # the failure modes above unless you know to look for it.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # THE GATE. Everything above this point can succeed while the review does
      # not happen, which is the whole problem: five separate causes have each
      # produced a green job that posted nothing, and a reviewer gate that
      # cannot fail is not a gate.
      #
      # This reads the action's own execution log and fails the job on the two
      # conditions that are unambiguously broken, both machine-readable rather
      # than matched against prose:
      #
      #   started_in_background > completed
      #       The session ended with reviewers still running. On PR #239 the
      #       terminal record read started_in_background: 6, completed: 3,
      #       failed: 0, is_error: false, subtype: "success", with
      #       result: "Four review agents are running in parallel ... I'll
      #       report once they all come back." Three reviewers were killed
      #       mid-flight and the job went green. On PR #238 the same thing lost
      #       a real defect that then reached main.
      #
      #   spawned == 0
      #       The command never fanned out, so nothing was reviewed.
      #
      # Denials are reported but do NOT fail: see the note at the check itself.
      # They were present in the v7.0.1 (21) and v7.2.1 (26) failures, but so was
      # abandonment, and abandonment is the signal that discriminates a broken
      # run from a sandbox correctly refusing something.
      #
      # Deliberately NOT a failure: posting no comment. A genuinely clean review
      # may have nothing to say, and failing on that would train everyone to
      # ignore a red gate. It is reported as a notice instead.
      #
      # This step must fail loudly if it cannot find or parse the log. A guard
      # that passes when it cannot see anything is the bug it exists to catch.
      - name: Fail if the review did not actually finish
        if: always() && steps.claude-review.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FILE="${EXECUTION_FILE:-}"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            FILE="${RUNNER_TEMP}/claude-execution-output.json"
          fi

          if [ ! -f "$FILE" ]; then
            # One legitimate reason there is no log: the action refuses to run at
            # all when the workflow file differs from the copy on the default
            # branch ("Workflow validation failed ... identical content"). That
            # makes a PR editing THIS file unreviewable by design, so failing it
            # would block every future fix to the reviewer. Detect that case
            # specifically and pass with a notice; anything else is a real
            # "we cannot tell whether the review ran", which must fail.
            if gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' 2>/dev/null \
                 | grep -qx '.github/workflows/claude-code-review.yml'; then
              echo "::notice::No execution log because this PR edits the review workflow itself," \
                   "so the action skipped with a workflow-validation error. That is expected and" \
                   "documented. The review, and this gate, take effect on the next PR after merge." \
                   "Get a review on THIS pull request by commenting '@claude please review this diff'."
              exit 0
            fi
            echo "::error::Cannot find the Claude execution log. Expected it at" \
                 "'${EXECUTION_FILE:-<action output unset>}' or '${RUNNER_TEMP}/claude-execution-output.json'," \
                 "and this PR does not touch the review workflow, so the skip is not the expected one." \
                 "Failing rather than assuming the review ran."
            exit 1
          fi

          # The log is a JSON array of stream records. The last one of type
          # "result" carries the terminal accounting.
          RESULT="$(jq -c '[ (if type=="array" then .[] else . end)
                             | select(type=="object" and .type=="result") ] | last' "$FILE" 2>/dev/null || true)"
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            echo "::error::No terminal 'result' record in $FILE, so the review's own report of what it did is missing."
            exit 1
          fi

          # Field names verified against a real terminal record (run 35212917057,
          # PR #239). They are NOT what you would guess: the agent counters live
          # under .subagent_stats, and denials are an ARRAY .permission_denials,
          # not a count. A first draft of this gate read .background_tasks and
          # .permission_denials_count, found nothing, defaulted every value to 0
          # and passed the very run it was written to catch.
          started=$(jq -r '(.subagent_stats.started_in_background // 0)' <<<"$RESULT")
          completed=$(jq -r '(.subagent_stats.completed // 0)' <<<"$RESULT")
          failed=$(jq -r '(.subagent_stats.failed // 0)' <<<"$RESULT")
          denials=$(jq -r '((.permission_denials // []) | length)' <<<"$RESULT")
          denied_tools=$(jq -r '[(.permission_denials // [])[] | .tool_name] | unique | join(", ")' <<<"$RESULT")
          spawned=$(jq -r '(.subagent_stats.spawned // 0)' <<<"$RESULT")
          iserror=$(jq -r '(.is_error // false)' <<<"$RESULT")
          reason=$(jq -r '(.terminal_reason // "unknown")' <<<"$RESULT")
          summary=$(jq -r '(.result // "")' <<<"$RESULT" | head -c 400)
          # spawned, NOT started_in_background: agents can run in the foreground,
          # and then started_in_background is 0 while completed is not. The first
          # version subtracted the wrong pair and reported "-8 abandoned" on a
          # perfectly good run -- harmless there, but in a MIXED run the negative
          # from the foreground agents would have cancelled out real background
          # abandonment and passed it silently. Total spawned against total
          # accounted-for is the measure that holds in both modes.
          abandoned=$(( spawned - completed - failed ))

          echo "review agents: spawned=$spawned completed=$completed failed=$failed abandoned=$abandoned"
          echo "(of which started in background: $started)"
          echo "agents spawned: $spawned   denials: $denials ($denied_tools)"
          echo "is_error: $iserror   terminal_reason: $reason"
          echo "final result text: $summary"

          rc=0
          if [ "$iserror" = "true" ]; then
            echo "::error::The review session ended in an error state."
            rc=1
          fi
          if [ "$spawned" -eq 0 ] 2>/dev/null; then
            echo "::error::The review spawned no agents at all, so no review happened." \
                 "/code-review always fans out; a run that does not has stopped at step 1."
            rc=1
          fi
          # Denials are NOT a failure. The sandbox is meant to refuse things: the
          # allowlist deliberately excludes php/npm/make because a pull_request
          # run checks out an untrusted head, and shell output redirection is
          # blocked outright whatever is granted. The first real run under this
          # gate (PR #242) completed all 8 agents and posted a genuine review,
          # and was failed by this check over a single denied `php -l` -- a
          # refusal that is correct, intentional and permanent. Failing on that
          # would red every future review and train everyone to ignore the gate,
          # which is the failure mode it exists to prevent. Report and move on;
          # the signal that a review did not happen is abandonment, above.
          if [ "$denials" -gt 0 ] 2>/dev/null; then
            echo "::notice::$denials tool call(s) were denied. Expected for things the allowlist" \
                 "excludes on purpose (php, npm, make, shell redirection). If the review also came" \
                 "back thin, check whether a grant is genuinely missing: $denied_tools"
          fi
          if [ "$abandoned" -gt 0 ] 2>/dev/null; then
            echo "::error::The job ended with $abandoned of $spawned review agent(s) unaccounted for," \
                 "so this pull request was NOT fully reviewed even though the action reported success." \
                 "Re-run the job, or comment '@claude please review this diff' on the PR, which posts reliably."
            rc=1
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::notice::Review completed: $spawned agents spawned, $completed reported," \
                 "$abandoned abandoned, $denials denied. If no comment was posted, the review" \
                 "had nothing to report."
          fi
          exit $rc

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # A review run costs real money (~$2-3) and fans out across several
    # subagents, so don't spend it on pull requests that contain no reviewable
    # code. This repo opens plenty of prose-only PRs -- release notes, deploy
    # requests, changelog updates -- and those now skip the review entirely.
    #
    # IMPORTANT, because this is easy to get wrong: for pull_request events
    # GitHub evaluates these filters against the ENTIRE PR diff (base...head),
    # not against the individual push that triggered the run. So this does NOT
    # stop a doc-only push from re-reviewing a PR that also contains code --
    # verified on PR #193, where a push touching only .drafts/*.md still
    # triggered a full run. The only way to avoid that cost is to batch commits
    # before pushing.
    #
    # What it does buy: a wholly-documentation PR is skipped outright.
    paths-ignore:
      - '.drafts/**'
      - '.wiki/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  claude-review:
    # Skip Dependabot PRs: GitHub runs Dependabot-triggered pull_request
    # workflows with a restricted token that reads from Dependabot secrets, not
    # Actions secrets, so ANTHROPIC_API_KEY is empty and the review fails with
    # is_error. Guard here so these runs are skipped cleanly, not marked failed.
    if: github.actor != 'dependabot[bot]'

    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is REQUIRED for the review to post anything.
          #
          # Step 7 of the code-review command reads: "If --comment argument was
          # NOT provided, stop here. Do not post any GitHub comments." Without it
          # the command does the entire review -- launches its haiku/sonnet/opus
          # subagents, finds issues, validates them -- prints the summary to a
          # terminal nobody reads, and exits. The job goes green and the tokens are
          # billed either way.
          #
          # That silence was misdiagnosed three times as a permissions problem: PR
          # #192 granted Task/Read/Grep/Glob, then v7.0.3 fixed the allowedTools
          # whitespace splitting that had made those grants useless. Both were real
          # bugs, neither was the reason nothing posted. The tell was there all
          # along -- "No buffered inline comments" is what a review that was told
          # not to comment prints -- and reading the command's own definition would
          # have found it in one step.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'

          # Without this the review runs, reports success, bills for the tokens
          # and posts nothing -- v7.0.1's run finished with
          # permission_denials_count: 21 and "No buffered inline comments",
          # which is indistinguishable from "found no issues".
          #
          # The /code-review command declares only its gh calls and the inline
          # comment tool in its own frontmatter, but it fans the review out
          # across Haiku/Sonnet/Opus subagents. Launching those needs Task, and
          # the subagents need Read/Grep/Glob to look at the code, none of which
          # the frontmatter covers -- so those were the denied calls.
          #
          # Bash is scoped to the gh binary rather than granted wholesale:
          # pull_request runs check out an untrusted head, so a blanket Bash
          # grant would let a contributor's branch run arbitrary commands with a
          # token that has pull-requests: write.
          #
          # It must be Bash(gh:*) and NOT per-subcommand patterns like
          # Bash(gh pr view:*). The action splits this value on whitespace as
          # well as on commas, so a pattern containing spaces is shredded into
          # separate entries -- PR #193 passed Bash(gh pr view:*) and the parsed
          # allowedTools came back as "Bash(gh", "pr", "view:*)". None of those
          # match anything, so every gh call was still denied: 28 denials, $2.34
          # billed, nothing posted. Keep every pattern space-free.
          #
          # The read-only shell utilities are here because Claude Code matches a
          # compound command segment by segment: `gh pr diff 207 | head -200`
          # needs BOTH `gh` and `head` granted or the whole call is denied. The
          # review's subagents pipe gh output constantly, which is the most
          # likely source of the 26 denials on the v7.2.1 run (11 turns, $1.61,
          # nothing posted, `--comment` correctly present). None of these
          # binaries can execute code from the checked-out branch, so the
          # untrusted-head property the gh scoping protects is unaffected --
          # unlike a blanket Bash grant, or a grant of php/npm/make.
          #
          # Edit and Write are deliberately absent. A reviewer reports; it does
          # not rewrite the branch it is reviewing.
          claude_args: >-
            --allowedTools
            Task,Read,Grep,Glob,TodoWrite,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(awk:*),Bash(sed:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(find:*),Bash(ls:*),Bash(echo:*),mcp__github_inline_comment__create_inline_comment

          # This has now been diagnosed five times from a log that does not say
          # what was denied -- the action hides the SDK output by default, so
          # every round has been a guess, and three of the guesses were wrong.
          # Turning it on ends that: the next run names the denied calls
          # directly. The repository is public and the review output is posted
          # publicly anyway, so there is nothing here the log did not already
          # contain; the API key is masked by the action, not by this flag.
          show_full_output: true
          # WHAT THE FULL LOG ACTUALLY SHOWED, once show_full_output was on.
          # Six rounds of guessing ended here, and neither cause was guessable
          # from the old log. Run 33258383102 on PR #208:
          #
          #   1. Every single denial was `gh pr diff <N> ... > somefile`. The
          #      review's subagents redirect the diff to a file because it is
          #      large. Shell output redirection is a WRITE, and it is refused
          #      even for a path inside the checkout:
          #        "Output redirection to '.../diffout.txt' was blocked. For
          #         security, Claude Code may only write to files in the allowed
          #         working directories for this session: '.../<the checkout>'"
          #      The tool grant cannot lift this -- the block is on redirection
          #      itself, not on the `gh` binary, and granting Write to a
          #      pull_request run that checks out an untrusted head is not a
          #      trade worth making. Adding awk/sed here at least lets a subagent
          #      fall back to piping instead of redirecting; one denial in that
          #      run was a pipe into awk.
          #
          #   2. The run then ENDED without waiting. Final result text was
          #      literally "All four review agents are running in parallel.
          #      Waiting for results.", num_turns 9, $1.69 billed. Step 4 of the
          #      command launches its four reviewers, the SDK launched them
          #      ASYNCHRONOUSLY, and the session terminated before any of them
          #      reported back. Nothing was ever synthesised, so there was
          #      nothing to post -- which is why the log says "No buffered
          #      inline comments" while looking, once again, exactly like a
          #      clean review.
          #
          # Neither of these lives in this file. Until they are fixed upstream,
          # `@claude please review this diff` in a PR comment is the working
          # path -- that workflow posts, and it produced ten findings on #207.
          #
          # One more way this posts nothing, and it is in the command, not here:
          # step 1 of /code-review launches a haiku agent that stops the whole
          # review if the PR is closed, is a draft, looks automated, or if
          # "claude has already commented on this PR". So asking @claude for a
          # review in a comment and then pushing again means the second review
          # exits at step 1 by design. Not a bug, but indistinguishable from
          # the failure modes above unless you know to look for it.
          #
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
